[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation module (42 A-Maze-ing project)"
requires-python = ">=3.10"
authors = [
    { name = "Souhsain"},
    { name = "Magram"}
]

[tool.setuptools]
packages = ["mazegen"]